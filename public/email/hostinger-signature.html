<!--
  Neora Labs — firma HTML (formato div) para Hostinger Webmail

  Uso en Hostinger:
  1. Configuración → Firma → Crear nuevo (o editar)
  2. Abrir «Código fuente»
  3. Pegar SOLO el bloque <div> de abajo (empresa o personal)
  4. Guardar

  Cambia nombre, cargo y correo en la versión personal.
-->

<!-- ========== EMPRESA · info@neora-labs.com ========== -->
<div
  style="
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color: #182623;
    max-width: 420px;
  "
>
  <div style="margin: 0; padding: 0;">
    <div style="margin: 0 0 12px 0;">
      <a
        href="https://neoralabs.com"
        target="_blank"
        rel="noopener noreferrer"
        style="text-decoration: none;"
      >
        <img
          src="https://cdn.jsdelivr.net/gh/Neora-Labs/neora-labs@main/public/brand/logo-on-light.png"
          alt="Neora Labs"
          width="160"
          height="40"
          style="
            display: block;
            border: 0;
            outline: none;
            width: 160px;
            height: auto;
            max-width: 160px;
          "
        />
      </a>
    </div>

    <div style="margin: 0; color: #485c58; font-size: 13px; line-height: 18px;">
      Software a medida para Europa y EE.&nbsp;UU.
    </div>

    <div
      style="
        width: 36px;
        height: 2px;
        background-color: #087e6b;
        margin: 10px 0;
        font-size: 0;
        line-height: 0;
      "
    >
      &nbsp;
    </div>

    <div style="margin: 0 0 2px 0; line-height: 20px;">
      <a
        href="mailto:info@neora-labs.com"
        style="color: #087e6b; text-decoration: none;"
        >info@neora-labs.com</a
      >
    </div>

    <div style="margin: 0; line-height: 20px;">
      <a
        href="https://neoralabs.com"
        target="_blank"
        rel="noopener noreferrer"
        style="color: #087e6b; text-decoration: none;"
        >neoralabs.com</a
      >
    </div>

    <div
      style="
        margin: 8px 0 0 0;
        color: #485c58;
        font-size: 11px;
        line-height: 16px;
        letter-spacing: 0.4px;
      "
    >
      Colombia · Polonia · España
    </div>
  </div>
</div>
